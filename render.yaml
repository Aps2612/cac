# Render Blueprint — marketing website only.
# The existing product web service (customer-acquisition) is NOT managed here
# and is unaffected by this file.
services:
  - type: web
    runtime: static
    name: nirnaya-website
    branch: main
    rootDir: website
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    buildFilter:
      paths:
        - website/**
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
