[project]
name = "cac"
version = "0.1.0"
description = "Customer intelligence / decisioning layer MVP: a crash-safe pipeline that profiles customers, cohorts them daily, authors LLM strategy per cohort, personalizes per customer, gates through governance, dispatches to a (mock) CEP, and measures incremental lift vs. a holdout."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "anthropic>=0.39",
    "openai>=1.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
cac = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
