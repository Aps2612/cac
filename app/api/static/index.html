<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CAC - The Missing Brain</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: { extend: { colors: { ink: "#0b1020", panel: "#121a2e", panel2: "#0f1626", line: "#23304d" } } }
    };
  </script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <!-- Pin Babel 7: Babel 8's preset-react defaults to the automatic JSX runtime, which emits
       `import ... from "react/jsx-runtime"` and cannot run as a classic in-browser <script>. -->
  <script src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>
  <style>
    body { background: radial-gradient(1200px 600px at 70% -10%, #16224a 0%, #0b1020 55%); }
    ::-webkit-scrollbar { height: 8px; width: 8px; }
    ::-webkit-scrollbar-thumb { background: #2a385a; border-radius: 8px; }
  </style>
</head>
<body class="text-slate-200">
  <div id="root" class="min-h-screen"></div>

  <script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback } = React;

const api = async (path, opts) => {
  const res = await fetch(path, opts);
  if (!res.ok) throw new Error(await res.text());
  return res.json();
};
const pct = (x) => (x == null ? "-" : (x * 100).toFixed(2) + "%");
const pp = (x) => (x == null ? "-" : (x >= 0 ? "+" : "") + (x * 100).toFixed(2) + "pp");
const money = (x) => (x == null ? "-" : "$" + Math.round(x).toLocaleString());
const num = (x) => (x == null ? "-" : Number(x).toLocaleString());

const REASON_LABELS = {
  strategy_stay_quiet: "Strategy: stay quiet",
  holdout_control: "Held out (control)",
  opted_out: "Opted out",
  no_consent: "No channel consent",
  frequency_cap: "Frequency cap",
  suppression_list: "Do-not-contact list",
  offer_exceeds_cap: "Offer over cap",
};

function Badge({ children, tone = "slate" }) {
  const tones = {
    slate: "bg-slate-700/40 text-slate-300 border-slate-600/40",
    green: "bg-emerald-500/15 text-emerald-300 border-emerald-500/30",
    amber: "bg-amber-500/15 text-amber-300 border-amber-500/30",
    indigo: "bg-indigo-500/15 text-indigo-300 border-indigo-500/30",
    red: "bg-rose-500/15 text-rose-300 border-rose-500/30",
  };
  return <span className={"inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs border " + tones[tone]}>{children}</span>;
}

function Card({ children, className = "" }) {
  return <div className={"bg-panel/80 border border-line rounded-2xl shadow-lg " + className}>{children}</div>;
}

function Kpi({ label, value, sub, tone = "slate" }) {
  const color = tone === "green" ? "text-emerald-400" : tone === "indigo" ? "text-indigo-300" : "text-slate-100";
  return (
    <Card className="p-4">
      <div className="text-xs uppercase tracking-wider text-slate-400">{label}</div>
      <div className={"text-2xl font-bold mt-1 " + color}>{value}</div>
      {sub && <div className="text-xs text-slate-400 mt-1">{sub}</div>}
    </Card>
  );
}

function StageStrip({ stages }) {
  const order = ["profile", "cohort", "strategy", "personalize", "govern", "dispatch", "measure"];
  const labels = { profile: "Profile", cohort: "Cohort", strategy: "Strategy (LLM)", personalize: "Personalize", govern: "Govern", dispatch: "Dispatch", measure: "Measure" };
  const map = Object.fromEntries((stages || []).map((s) => [s.stage, s.status]));
  return (
    <div className="flex flex-wrap items-center gap-2">
      {order.map((s, i) => {
        const st = map[s] || "pending";
        const tone = st === "completed" ? "bg-emerald-500" : st === "running" ? "bg-amber-400 animate-pulse" : st === "failed" ? "bg-rose-500" : "bg-slate-600";
        return (
          <React.Fragment key={s}>
            <div className="flex items-center gap-2">
              <span className={"w-2.5 h-2.5 rounded-full " + tone}></span>
              <span className="text-sm text-slate-300">{labels[s]}</span>
            </div>
            {i < order.length - 1 && <span className="text-slate-600">›</span>}
          </React.Fragment>
        );
      })}
    </div>
  );
}

function offerText(strategy) {
  if (!strategy || strategy.should_suppress) return null;
  const o = strategy.offer || {};
  if (o.type === "percent_off") return `${Math.round(o.value)}% off`;
  if (o.type === "amount_off") return `${Math.round(o.value)} off`;
  if (o.type === "free_shipping") return "Free shipping";
  return "No discount";
}

function CohortCard({ c, lift }) {
  const s = c.strategy;
  const quiet = s && s.should_suppress;
  return (
    <Card className="p-4 flex flex-col gap-3">
      <div className="flex items-start justify-between gap-2">
        <div>
          <div className="font-semibold text-slate-100">{c.name}</div>
          <div className="text-xs text-slate-400">{num(c.size)} customers</div>
        </div>
        {quiet ? <Badge tone="amber">Stay quiet</Badge> : <Badge tone="indigo">{(s && s.recommended_channel) || "email"}</Badge>}
      </div>

      {quiet ? (
        <div className="text-sm text-amber-200/80 italic">"{s.suppress_reason}"</div>
      ) : (
        <div className="text-sm text-slate-300 italic line-clamp-3">"{s ? s.messaging_angle : ""}"</div>
      )}

      <div className="flex flex-wrap gap-2">
        {!quiet && <Badge tone="green">{offerText(s)}</Badge>}
        <Badge tone="green">{num(c.reached)} reached</Badge>
        <Badge tone="amber">{num(c.control)} control</Badge>
        <Badge tone="slate">{num(c.suppressed)} suppressed</Badge>
      </div>

      {lift && !quiet && (
        <div className="mt-1 flex items-center justify-between text-sm border-t border-line pt-2">
          <span className="text-slate-400">Lift</span>
          <span className={lift.abs_lift > 0 ? "text-emerald-400 font-semibold" : "text-slate-300"}>
            {pp(lift.abs_lift)} <span className="text-slate-500 text-xs">(p={Number(lift.p_value).toFixed(3)})</span>
          </span>
        </div>
      )}
    </Card>
  );
}

function LiftPanel({ m }) {
  if (!m || !m.overall) return <Card className="p-5 text-slate-400">No measurement yet.</Card>;
  const o = m.overall;
  const max = Math.max(o.treatment_rate, o.control_rate, 0.01);
  const Bar = ({ label, rate, tone }) => (
    <div className="mb-3">
      <div className="flex justify-between text-sm mb-1"><span className="text-slate-300">{label}</span><span className="font-semibold">{pct(rate)}</span></div>
      <div className="h-3 bg-slate-800 rounded-full overflow-hidden">
        <div className={"h-full rounded-full " + tone} style={{ width: (rate / max) * 100 + "%" }}></div>
      </div>
    </div>
  );
  const sig = o.p_value < 0.05;
  return (
    <Card className="p-5">
      <div className="flex items-baseline justify-between mb-4">
        <h3 className="font-semibold text-slate-100">Incremental lift vs. holdout</h3>
        <Badge tone={sig ? "green" : "amber"}>{sig ? "statistically significant" : "not yet significant"} · p={Number(o.p_value).toPrecision(2)}</Badge>
      </div>
      <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
        <div className="md:col-span-2">
          <Bar label={`Treatment (n=${num(o.treatment_n)})`} rate={o.treatment_rate} tone="bg-emerald-500" />
          <Bar label={`Control / holdout (n=${num(o.control_n)})`} rate={o.control_rate} tone="bg-slate-500" />
          <div className="text-xs text-slate-400 mt-2">
            95% CI on absolute lift: [{pp(o.ci_low)}, {pp(o.ci_high)}]. This is real incremental conversion the program caused - not last-touch attribution.
          </div>
        </div>
        <div className="flex flex-col justify-center items-center bg-panel2 rounded-xl p-4 border border-line">
          <div className="text-xs uppercase tracking-wider text-slate-400">Absolute lift</div>
          <div className="text-4xl font-extrabold text-emerald-400">{pp(o.abs_lift)}</div>
          <div className="text-sm text-slate-300 mt-1">{(o.rel_lift * 100).toFixed(0)}% relative</div>
          <div className="text-sm text-emerald-300/90 mt-2">{money(o.revenue_lift)} revenue lift</div>
        </div>
      </div>
    </Card>
  );
}

function SuppressionPanel({ rows }) {
  const total = (rows || []).reduce((a, r) => a + Number(r.n), 0) || 1;
  return (
    <Card className="p-5">
      <h3 className="font-semibold text-slate-100 mb-3">Governance: who we did <span className="text-slate-400">not</span> message</h3>
      {(rows || []).length === 0 && <div className="text-slate-400 text-sm">Nothing suppressed.</div>}
      {(rows || []).map((r) => (
        <div key={r.reason} className="mb-2">
          <div className="flex justify-between text-sm mb-1">
            <span className="text-slate-300">{REASON_LABELS[r.reason] || r.reason}</span>
            <span className="text-slate-400">{num(r.n)}</span>
          </div>
          <div className="h-2 bg-slate-800 rounded-full overflow-hidden">
            <div className="h-full bg-indigo-500/70 rounded-full" style={{ width: (Number(r.n) / total) * 100 + "%" }}></div>
          </div>
        </div>
      ))}
    </Card>
  );
}

function JsonModal({ decision, onClose }) {
  if (!decision) return null;
  const inst = decision.instruction;
  return (
    <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50" onClick={onClose}>
      <Card className="max-w-2xl w-full p-5 max-h-[85vh] overflow-auto" >
        <div className="flex justify-between items-start mb-3" onClick={(e) => e.stopPropagation()}>
          <div>
            <div className="font-semibold text-slate-100">{decision.full_name} · {decision.customer_id}</div>
            <div className="text-xs text-slate-400">{decision.cohort_name}</div>
          </div>
          <button className="text-slate-400 hover:text-slate-200" onClick={onClose}>✕</button>
        </div>
        <div onClick={(e) => e.stopPropagation()}>
          {decision.message && (
            <div className="mb-4">
              <div className="text-xs uppercase tracking-wider text-slate-400 mb-1">Personalized copy</div>
              <div className="bg-panel2 border border-line rounded-lg p-3">
                <div className="font-medium text-slate-100">{decision.message.subject}</div>
                <div className="text-sm text-slate-300 mt-1">{decision.message.body}</div>
                <div className="mt-2"><Badge tone="indigo">{decision.message.cta}</Badge></div>
              </div>
            </div>
          )}
          <div className="text-xs uppercase tracking-wider text-slate-400 mb-1">
            {inst ? "Emitted JSON instruction → CEP" : "Decision (suppressed: " + (decision.suppressed_reason || "") + ")"}
          </div>
          <pre className="bg-[#0a0f1d] border border-line rounded-lg p-3 text-xs text-emerald-200 overflow-auto">
{JSON.stringify(inst || { action: decision.action, status: decision.status, channel: decision.channel, offer: decision.offer, reason: decision.suppressed_reason }, null, 2)}
          </pre>
        </div>
      </Card>
    </div>
  );
}

function DecisionsTable({ runId, cohorts }) {
  const [rows, setRows] = useState([]);
  const [cohort, setCohort] = useState("");
  const [status, setStatus] = useState("");
  const [sel, setSel] = useState(null);

  const load = useCallback(() => {
    const q = new URLSearchParams({ limit: "40" });
    if (cohort) q.set("cohort", cohort);
    if (status) q.set("status", status);
    api(`/api/runs/${runId}/decisions?` + q.toString()).then(setRows).catch(() => setRows([]));
  }, [runId, cohort, status]);
  useEffect(() => { load(); }, [load]);

  const statusTone = { dispatched: "green", suppressed: "slate", allowed: "indigo", pending: "amber" };
  return (
    <Card className="p-5">
      <div className="flex flex-wrap items-center justify-between gap-3 mb-3">
        <h3 className="font-semibold text-slate-100">Per-customer decisions</h3>
        <div className="flex gap-2">
          <select className="bg-panel2 border border-line rounded-lg px-2 py-1 text-sm" value={cohort} onChange={(e) => setCohort(e.target.value)}>
            <option value="">All cohorts</option>
            {cohorts.map((c) => <option key={c.key} value={c.key}>{c.name}</option>)}
          </select>
          <select className="bg-panel2 border border-line rounded-lg px-2 py-1 text-sm" value={status} onChange={(e) => setStatus(e.target.value)}>
            <option value="">Any status</option>
            <option value="dispatched">Dispatched</option>
            <option value="suppressed">Suppressed</option>
          </select>
        </div>
      </div>
      <div className="overflow-auto max-h-[480px]">
        <table className="w-full text-sm">
          <thead className="text-slate-400 text-xs uppercase sticky top-0 bg-panel">
            <tr><th className="text-left py-2">Customer</th><th className="text-left">Cohort</th><th className="text-left">Channel</th><th className="text-left">Product</th><th className="text-left">Offer</th><th className="text-left">Status</th></tr>
          </thead>
          <tbody>
            {rows.map((d) => (
              <tr key={d.decision_id} className="border-t border-line/60 hover:bg-white/5 cursor-pointer" onClick={() => setSel(d)}>
                <td className="py-2 pr-2 text-slate-200">{d.full_name}<div className="text-xs text-slate-500">{d.customer_id}</div></td>
                <td className="pr-2 text-slate-300">{d.cohort_name}</td>
                <td className="pr-2">{d.channel || "-"}</td>
                <td className="pr-2 text-slate-300">{d.product_title || "-"}</td>
                <td className="pr-2">{d.offer && d.offer.type !== "none" ? (d.offer.code || d.offer.type) : "-"}</td>
                <td><Badge tone={statusTone[d.status] || "slate"}>{d.status === "suppressed" && d.holdout_group === "control" ? "control" : d.status}</Badge></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <JsonModal decision={sel} onClose={() => setSel(null)} />
    </Card>
  );
}

function App() {
  const [runs, setRuns] = useState([]);
  const [runId, setRunId] = useState(null);
  const [detail, setDetail] = useState(null);
  const [cohorts, setCohorts] = useState([]);
  const [measure, setMeasure] = useState(null);
  const [supp, setSupp] = useState([]);
  const [stats, setStats] = useState({});
  const [busy, setBusy] = useState(false);

  const loadRuns = useCallback(async () => {
    const r = await api("/api/runs");
    setRuns(r);
    if (r.length && !runId) setRunId(r[0].run_id);
    return r;
  }, [runId]);

  const loadRun = useCallback(async (id) => {
    if (!id) return;
    const [d, c, m, s, st] = await Promise.all([
      api(`/api/runs/${id}`), api(`/api/runs/${id}/cohorts`), api(`/api/runs/${id}/measurement`),
      api(`/api/runs/${id}/suppressions`), api(`/api/stats`),
    ]);
    setDetail(d); setCohorts(c); setMeasure(m); setSupp(s); setStats(st);
  }, []);

  useEffect(() => { loadRuns(); }, []);
  useEffect(() => { if (runId) loadRun(runId); }, [runId, loadRun]);

  const runPipeline = async () => {
    setBusy(true);
    try {
      const res = await api("/api/runs", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({}) });
      await loadRuns();
      setRunId(res.run_id);
      await loadRun(res.run_id);
    } catch (e) { alert("Run failed: " + e.message); }
    setBusy(false);
  };

  const liftByName = Object.fromEntries(((measure && measure.per_cohort) || []).map((r) => [r.label, r]));
  const funnel = (detail && detail.funnel) || {};
  const o = measure && measure.overall;

  return (
    <div className="max-w-7xl mx-auto px-4 py-6">
      <header className="flex flex-wrap items-center justify-between gap-4 mb-6">
        <div>
          <h1 className="text-2xl font-bold text-white">CAC <span className="text-indigo-400">·</span> The Missing Brain</h1>
          <p className="text-sm text-slate-400">One operator → every customer reached individually. Decisioning layer for retention.</p>
        </div>
        <div className="flex items-center gap-3">
          <select className="bg-panel2 border border-line rounded-lg px-3 py-2 text-sm" value={runId || ""} onChange={(e) => setRunId(e.target.value)}>
            {runs.map((r) => <option key={r.run_id} value={r.run_id}>{r.objective} · {new Date(r.created_at).toLocaleString()} · {r.status}</option>)}
          </select>
          <button onClick={runPipeline} disabled={busy}
            className="bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white px-4 py-2 rounded-lg text-sm font-medium">
            {busy ? "Running…" : "▶ Run pipeline"}
          </button>
        </div>
      </header>

      <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3 mb-6">
        <Kpi label="Customers" value={num(stats.customers)} sub={num(stats.orders) + " orders"} />
        <Kpi label="Targeted individually" value={num(funnel.targeted)} sub="vs. 1 generic blast" tone="indigo" />
        <Kpi label="Reached" value={num(funnel.dispatched)} sub="messages dispatched" tone="green" />
        <Kpi label="Held-out control" value={num(funnel.control)} sub="to measure lift" tone="amber" />
        <Kpi label="Suppressed" value={num(funnel.suppressed)} sub="by governance + strategy" />
        <Kpi label="Repeat-rate lift" value={o ? pp(o.abs_lift) : "-"} sub={o ? money(o.revenue_lift) + " rev" : ""} tone="green" />
      </div>

      <Card className="p-4 mb-6">
        <div className="flex flex-wrap items-center justify-between gap-3">
          <StageStrip stages={detail && detail.stages} />
          <div className="text-xs text-slate-400">
            LLM: {detail && detail.run && detail.run.params ? detail.run.params.llm_provider : "-"} ·
            cost {detail && detail.run && detail.run.stats ? money(detail.run.stats.llm_cost_usd || 0) : "$0"} ·
            {" "}{detail && detail.run && detail.run.stats ? num(detail.run.stats.llm_calls || 0) : 0} calls
          </div>
        </div>
      </Card>

      <div className="mb-6"><LiftPanel m={measure} /></div>

      <h2 className="text-lg font-semibold text-slate-100 mb-3">Cohorts &amp; their LLM strategy</h2>
      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-6">
        {cohorts.map((c) => <CohortCard key={c.cohort_id} c={c} lift={liftByName[c.name]} />)}
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
        <div className="lg:col-span-2">{runId && <DecisionsTable runId={runId} cohorts={cohorts} />}</div>
        <div><SuppressionPanel rows={supp} /></div>
      </div>

      <footer className="text-center text-xs text-slate-500 mt-8">
        Synthetic data · dispatch simulated via mock CEP · outcomes simulated for the demo. The systems (crash-safe pipeline, validated LLM strategy, non-negotiable governance) are real.
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
