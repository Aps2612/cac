services:
  db:
    image: postgres:16
    container_name: cac_postgres
    environment:
      POSTGRES_USER: cac
      POSTGRES_PASSWORD: cac
      POSTGRES_DB: cac
    ports:
      # Host 55432 -> container 5432 (avoids clashing with a local Postgres on 5432)
      - "55432:5432"
    volumes:
      - cac_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cac -d cac"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  cac_pgdata:
